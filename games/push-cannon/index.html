<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PUSH CANNON - 腕立て砲撃RPG</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap');

*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0a0f;color:#fff;font-family:'Rajdhani',sans-serif;overflow:hidden;height:100vh;width:100vw;}
@media (orientation: portrait) {
  body::after{content:'横向きにしてプレイ';position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0a0f;z-index:9999;display:flex;align-items:center;justify-content:center;font-size:24px;color:#0ff;font-family:'Orbitron',monospace;letter-spacing:4px;}
}

#app{position:relative;width:100vw;height:100vh;}

#gameCanvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:2;pointer-events:none;}

#camBox{position:absolute;bottom:8px;right:8px;z-index:20;border:2px solid #fff3;border-radius:6px;overflow:hidden;background:#000;pointer-events:none;}
video{display:block;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);}
#poseCanvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}

.hud{position:absolute;z-index:10;pointer-events:none;}

#floorDisplay{top:10px;left:50%;transform:translateX(-50%);font-family:'Orbitron',monospace;text-align:center;}
#floorDisplay .label{font-size:11px;color:#ff08;letter-spacing:3px;}
#floorDisplay .value{font-size:26px;color:#ff0;text-shadow:0 0 12px #ff0;}

#repDisplay{top:10px;left:16px;font-family:'Orbitron',monospace;}
#repDisplay .label{font-size:10px;color:#0ff8;letter-spacing:2px;}
#repDisplay .value{font-size:22px;color:#0ff;text-shadow:0 0 12px #0ff;}

#streakDisplay{top:10px;right:16px;text-align:right;font-family:'Orbitron',monospace;}
#streakDisplay .label{font-size:10px;color:#f808;letter-spacing:2px;}
#streakDisplay .value{font-size:22px;color:#f80;text-shadow:0 0 12px #f80;}

#poseStatus{bottom:16px;left:50%;transform:translateX(-50%);font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;padding:5px 16px;border-radius:30px;border:2px solid;transition:all 0.15s;}
#poseStatus.up{color:#0f0;border-color:#0f04;background:#0f01;}
#poseStatus.down{color:#f80;border-color:#f804;background:#f801;}
#poseStatus.none{color:#fff4;border-color:#fff2;background:#fff01;}

#damageFlash{position:absolute;top:30%;left:60%;transform:translate(-50%,-50%);z-index:15;font-family:'Orbitron',monospace;font-size:44px;font-weight:900;text-align:center;pointer-events:none;opacity:0;transition:all 0.4s;}

#startScreen{position:absolute;top:0;left:0;width:100%;height:100%;z-index:100;background:radial-gradient(ellipse at center,#1a1a2e 0%,#0a0a0f 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
#startScreen h1{font-family:'Orbitron',monospace;font-size:52px;font-weight:900;background:linear-gradient(135deg,#f80,#ff0,#0ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 30px #f804);letter-spacing:6px;}
#startScreen .sub{font-size:18px;color:#fff6;letter-spacing:6px;margin-bottom:10px;}
#startScreen .instructions{font-size:15px;color:#fff5;max-width:500px;text-align:center;line-height:2;margin-bottom:14px;}
#startScreen .instructions strong{color:#0ff;}
#startScreen .instructions em{color:#f80;font-style:normal;}
#startScreen .best-records{font-size:13px;color:#fff4;margin-bottom:10px;font-family:'Orbitron',monospace;}
#startScreen .best-records span{color:#ff0;}

.btn{font-family:'Orbitron',monospace;font-size:18px;font-weight:700;padding:14px 44px;border:2px solid #f80;background:#f801;color:#f80;cursor:pointer;letter-spacing:4px;transition:all 0.2s;pointer-events:all;border-radius:4px;}
.btn:hover{background:#f803;box-shadow:0 0 30px #f804;transform:scale(1.05);}

#loadingOverlay{position:absolute;top:0;left:0;width:100%;height:100%;z-index:200;background:#0a0a0f;display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;}
#loadingOverlay .spinner{width:50px;height:50px;border:3px solid #f802;border-top-color:#f80;border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#loadingOverlay p{font-family:'Orbitron',monospace;font-size:16px;color:#f808;letter-spacing:3px;}

#errorMsg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:300;background:#200;border:2px solid #f44;padding:30px 40px;font-size:18px;color:#faa;text-align:center;max-width:500px;line-height:1.6;display:none;border-radius:8px;}
</style>
</head>
<body>
<div id="app">
  <canvas id="gameCanvas"></canvas>
  <div id="camBox">
    <video id="webcam" playsinline autoplay muted></video>
    <canvas id="poseCanvas"></canvas>
  </div>

  <div id="floorDisplay" class="hud">
    <div class="label">FLOOR</div>
    <div class="value" id="floorVal">1</div>
  </div>
  <div id="repDisplay" class="hud">
    <div class="label">TOTAL REPS</div>
    <div class="value" id="repVal">0</div>
  </div>
  <div id="streakDisplay" class="hud">
    <div class="label">STREAK</div>
    <div class="value" id="streakVal">0</div>
  </div>
  <div id="poseStatus" class="hud none">検出待ち</div>
  <div id="damageFlash"></div>

  <div id="startScreen">
    <h1>PUSH CANNON</h1>
    <div class="sub">腕立て砲撃RPG</div>
    <div class="instructions">
      カメラの前で<strong>腕立て伏せ</strong>をしよう！<br>
      <em>腕を曲げる深さ</em>で砲撃の狙いが変わる<br>
      <strong>腕を伸ばす</strong>と発射！<br>
      少しキープすると精度UP！無理せずマイペースで
    </div>
    <div class="best-records" id="bestRecords"></div>
    <button class="btn" id="startBtn">START</button>
  </div>

  <div id="loadingOverlay">
    <div class="spinner"></div>
    <p id="loadingText">LOADING...</p>
  </div>

  <div id="errorMsg"></div>
</div>

<script>
(() => {
// ============ ELEMENTS ============
const video = document.getElementById('webcam');
const poseCanvas = document.getElementById('poseCanvas');
const gameCanvas = document.getElementById('gameCanvas');
const camBox = document.getElementById('camBox');
const poseCtx = poseCanvas.getContext('2d');
const gCtx = gameCanvas.getContext('2d');
const floorEl = document.getElementById('floorVal');
const repEl = document.getElementById('repVal');
const streakEl = document.getElementById('streakVal');
const poseStatusEl = document.getElementById('poseStatus');
const damageEl = document.getElementById('damageFlash');
const startScreen = document.getElementById('startScreen');
const bestRecordsEl = document.getElementById('bestRecords');
const loadingOverlay = document.getElementById('loadingOverlay');
const loadingText = document.getElementById('loadingText');
const errorMsg = document.getElementById('errorMsg');

// ============ GAME STATE ============
let gameRunning = false;
let floor = 1;
let totalReps = 0;
let streak = 0;
let maxStreak = 0;

// Pose
let poseState = 'none';
let prevPoseState = 'none';
let currentElbowAngle = 180;

// 砲撃
let launchAngle = 45;
let angleLocked = false;
let angleStableStart = 0;
let lastStableAngle = -1;
const LOCK_TIME = 600;
const ANGLE_TOLERANCE = 15;

// 砲弾
let projectile = null;
let projectileTrail = [];
let explosions = [];
const GRAVITY = 600;
const LAUNCH_SPEED = 550;
const HIT_DAMAGE = 20;

// Monster
let monster = null;
let monsterHitAnim = 0;
let monsterDeadAnim = 0;
let particles = [];

// Juice effects
let shakeIntensity = 0;
let shakeDecay = 0;
let cannonRecoil = 0;
let hitFlashTimer = 0;
let floorClearAnim = 0;
let floorClearName = '';

// World
const GROUND_RATIO = 0.78;
const CANNON_X_RATIO = 0.10;
const MONSTER_HIT_RADIUS = 45;

// Audio
let audioCtx = null;

// Records
let bestFloor = 0, bestReps = 0, bestStreak = 0;

// ============ MONSTERS ============
const MONSTER_DEFS = [
  { name: 'スライム',       hp: 40,  color: '#00ff00', glow: '#00ff0044', type: 'slime' },
  { name: 'ゴブリン',       hp: 60,  color: '#ff8800', glow: '#ff880044', type: 'goblin' },
  { name: 'スケルトン',     hp: 80,  color: '#00ffff', glow: '#00ffff44', type: 'skeleton' },
  { name: 'ダークウルフ',   hp: 100, color: '#cc00ff', glow: '#cc00ff44', type: 'wolf' },
  { name: 'ドラゴン',       hp: 140, color: '#ff00ff', glow: '#ff00ff44', type: 'dragon' },
];

function getMonsterDef(floorNum) {
  const idx = (floorNum - 1) % MONSTER_DEFS.length;
  const cycle = Math.floor((floorNum - 1) / MONSTER_DEFS.length);
  const def = MONSTER_DEFS[idx];
  const isBoss = def.type === 'dragon';
  const dist = isBoss
    ? 0.68 + Math.random() * 0.14
    : 0.40 + Math.random() * 0.32;
  return {
    name: def.name,
    maxHp: Math.round(def.hp * Math.pow(1.4, cycle)),
    hp: Math.round(def.hp * Math.pow(1.4, cycle)),
    color: def.color,
    glow: def.glow,
    type: def.type,
    dist: dist,
  };
}

// ============ RECORDS (localStorage) ============
function loadRecords() {
  try {
    const d = JSON.parse(localStorage.getItem('pushcannon_best') || '{}');
    bestFloor = d.floor || 0;
    bestReps = d.reps || 0;
    bestStreak = d.streak || 0;
  } catch(e) {}
  updateRecordsDisplay();
}
function saveRecords() {
  let changed = false;
  if (floor > bestFloor) { bestFloor = floor; changed = true; }
  if (totalReps > bestReps) { bestReps = totalReps; changed = true; }
  if (maxStreak > bestStreak) { bestStreak = maxStreak; changed = true; }
  if (changed) {
    try { localStorage.setItem('pushcannon_best', JSON.stringify({ floor: bestFloor, reps: bestReps, streak: bestStreak })); } catch(e) {}
  }
  return changed;
}
function updateRecordsDisplay() {
  if (bestFloor > 0) {
    bestRecordsEl.innerHTML = 'BEST: Floor <span>' + bestFloor + '</span> | Reps <span>' + bestReps + '</span> | Streak <span>' + bestStreak + '</span>';
  }
}

// ============ AUDIO ============
function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  audioCtx.resume();
}

function playTone(freq, dur, vol, type) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + dur);
}

function playNoiseBurst(dur, vol, lpFreq) {
  if (!audioCtx) return;
  const sz = Math.round(audioCtx.sampleRate * dur);
  const buf = audioCtx.createBuffer(1, sz, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < sz; i++) d[i] = Math.random() * 2 - 1;
  const src = audioCtx.createBufferSource(); src.buffer = buf;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  if (lpFreq) {
    const lp = audioCtx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = lpFreq;
    src.connect(lp).connect(g).connect(audioCtx.destination);
  } else {
    src.connect(g).connect(audioCtx.destination);
  }
  src.start(); src.stop(audioCtx.currentTime + dur);
}

function playHitSound() {
  playNoiseBurst(0.04, 0.2, 1200);
  playTone(200, 0.12, 0.2, 'triangle');
  setTimeout(() => playTone(300, 0.08, 0.1, 'triangle'), 30);
}
function playDefeatSound() {
  // 上昇アルペジオ
  [523, 659, 784, 1047].forEach((f, i) => {
    setTimeout(() => playTone(f, 0.2, 0.15, 'triangle'), i * 80);
  });
  // 持続和音
  setTimeout(() => {
    playTone(523, 0.6, 0.08, 'sine');
    playTone(659, 0.6, 0.08, 'sine');
    playTone(784, 0.6, 0.08, 'sine');
  }, 300);
}
function playLockSound() {
  playNoiseBurst(0.03, 0.25, 3000);
  setTimeout(() => {
    playTone(440, 0.3, 0.1, 'triangle');
    playTone(554, 0.3, 0.1, 'triangle');
    playTone(659, 0.3, 0.1, 'triangle');
  }, 40);
  if (navigator.vibrate) navigator.vibrate(80);
}
function playFireSound() {
  playNoiseBurst(0.15, 0.25, 800);
  playTone(60, 0.4, 0.35, 'triangle');
  playTone(120, 0.2, 0.15, 'sawtooth');
  if (navigator.vibrate) navigator.vibrate(50);
}
function playExplosionSound() {
  playNoiseBurst(0.3, 0.3, 500);
  playTone(40, 0.3, 0.3, 'triangle');
  playTone(80, 0.15, 0.15, 'sawtooth');
}
function playMissSound() {
  playNoiseBurst(0.06, 0.15, 500);
  playTone(80, 0.12, 0.12, 'triangle');
}
function playNewRecordSound() {
  [800, 1000, 1200, 1600].forEach((f, i) => {
    setTimeout(() => playTone(f, 0.15, 0.12, 'sine'), i * 60);
  });
}

// ============ RESIZE ============
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  gameCanvas.width = w; gameCanvas.height = h;
  const camH = Math.round(h * 0.28);
  const camW = Math.round(camH * 4 / 3);
  camBox.style.width = camW + 'px';
  camBox.style.height = camH + 'px';
  poseCanvas.width = camW; poseCanvas.height = camH;
}
window.addEventListener('resize', resize);
resize();

// ============ MEDIAPIPE POSE ============
let poseLandmarker = null;

async function initPose() {
  loadingOverlay.style.display = 'flex';
  try {
    loadingText.textContent = 'LOADING MEDIAPIPE...';
    const mp = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.34/vision_bundle.mjs');

    loadingText.textContent = 'LOADING POSE MODEL...';
    const vision = await mp.FilesetResolver.forVisionTasks(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.34/wasm'
    );

    poseLandmarker = await mp.PoseLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task',
        delegate: 'GPU'
      },
      runningMode: 'VIDEO',
      numPoses: 1
    });

    loadingText.textContent = 'STARTING CAMERA...';
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }
    });
    video.srcObject = stream;
    await video.play();

    loadingOverlay.style.display = 'none';

    let lastTime = -1;
    function detect() {
      requestAnimationFrame(detect);
      const now = performance.now();
      if (now === lastTime) return;
      lastTime = now;
      try {
        const results = poseLandmarker.detectForVideo(video, now);
        if (results.landmarks && results.landmarks.length > 0) {
          drawSkeleton(results.landmarks[0]);
          detectPushUp(results.landmarks[0]);
        } else {
          poseCtx.clearRect(0, 0, poseCanvas.width, poseCanvas.height);
          poseState = 'none';
        }
        updatePoseStatus();
      } catch(e) {}
    }
    requestAnimationFrame(detect);

  } catch(e) {
    loadingOverlay.style.display = 'none';
    errorMsg.textContent = 'カメラまたはMediaPipeの初期化に失敗しました。\n' + (e.message || e);
    errorMsg.style.display = 'block';
    console.error(e);
  }
}

// ============ SKELETON ============
function drawSkeleton(lm) {
  const W = poseCanvas.width, H = poseCanvas.height;
  poseCtx.clearRect(0, 0, W, H);
  const conns = [[11,13],[13,15],[12,14],[14,16],[11,12],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
  poseCtx.save();
  poseCtx.strokeStyle = poseState === 'down' ? '#f804' : '#0ff4';
  poseCtx.lineWidth = 2;
  for (const [a,b] of conns) {
    const la = lm[a], lb = lm[b];
    if (la && lb) {
      poseCtx.beginPath();
      poseCtx.moveTo((1-la.x)*W, la.y*H);
      poseCtx.lineTo((1-lb.x)*W, lb.y*H);
      poseCtx.stroke();
    }
  }
  for (const i of [11,12,13,14,15,16,23,24]) {
    const p = lm[i];
    if (p) {
      poseCtx.beginPath();
      poseCtx.arc((1-p.x)*W, p.y*H, 4, 0, Math.PI*2);
      poseCtx.fillStyle = poseState === 'down' ? '#f80' : '#0ff';
      poseCtx.fill();
    }
  }
  poseCtx.restore();
}

// ============ PUSH-UP DETECTION ============
function angleBetween(a, b, c) {
  const ab = {x:a.x-b.x, y:a.y-b.y, z:(a.z||0)-(b.z||0)};
  const cb = {x:c.x-b.x, y:c.y-b.y, z:(c.z||0)-(b.z||0)};
  const dot = ab.x*cb.x + ab.y*cb.y + ab.z*cb.z;
  const m1 = Math.sqrt(ab.x**2+ab.y**2+ab.z**2);
  const m2 = Math.sqrt(cb.x**2+cb.y**2+cb.z**2);
  if (m1*m2===0) return 180;
  return Math.acos(Math.min(1,Math.max(-1,dot/(m1*m2))))*(180/Math.PI);
}

function detectPushUp(lm) {
  const lS=lm[11], lE=lm[13], lW=lm[15];
  const rS=lm[12], rE=lm[14], rW=lm[16];
  let angles = [];
  if (lS&&lE&&lW) angles.push(angleBetween(lS,lE,lW));
  if (rS&&rE&&rW) angles.push(angleBetween(rS,rE,rW));
  if (!angles.length) { poseState='none'; return; }
  const avg = angles.reduce((a,b)=>a+b,0)/angles.length;

  currentElbowAngle = avg;
  prevPoseState = poseState;
  if (avg < 120) poseState = 'down';
  else if (avg > 150) poseState = 'up';

  const now = performance.now();

  if (!gameRunning || !monster || monster.hp <= 0) return;
  if (projectile && projectile.active) return;

  // DOWN中: 角度計算
  if (poseState === 'down') {
    const clamped = Math.max(60, Math.min(120, avg));
    const newAngle = 75 - (clamped - 60) / 60 * 60;

    if (!angleLocked) {
      // スムージング
      launchAngle = launchAngle * 0.7 + newAngle * 0.3;
      // ロック判定はスムージング後の値で行う
      if (lastStableAngle < 0) {
        lastStableAngle = launchAngle;
        angleStableStart = now;
      } else if (Math.abs(launchAngle - lastStableAngle) > ANGLE_TOLERANCE) {
        lastStableAngle = launchAngle;
        angleStableStart = now;
      } else if (now - angleStableStart >= LOCK_TIME) {
        angleLocked = true;
        launchAngle = lastStableAngle;
        playLockSound();
      }
    }
  }

  // UP → 発射 (ロック有無に関わらず発射。ロックなしは精度低下)
  if (prevPoseState === 'down' && poseState === 'up') {
    totalReps++;
    repEl.textContent = totalReps;
    if (!angleLocked) {
      // ロックなし発射: ランダムに角度がブレる (±12°)
      launchAngle += (Math.random() - 0.5) * 24;
      launchAngle = Math.max(5, Math.min(80, launchAngle));
    }
    fireProjectile();
    angleLocked = false;
    lastStableAngle = -1;

    // 休憩プロンプト (5レップごと)
    if (totalReps > 0 && totalReps % 5 === 0) {
      showRestPrompt();
    }
  }
}

function updatePoseStatus() {
  poseStatusEl.className = 'hud ' + poseState;
  if (poseState === 'up') poseStatusEl.textContent = '▲ UP';
  else if (poseState === 'down') poseStatusEl.textContent = '▼ DOWN';
  else poseStatusEl.textContent = '検出待ち';
}

// ============ PROJECTILE ============
function fireProjectile() {
  const W = gameCanvas.width, H = gameCanvas.height;
  const groundY = H * GROUND_RATIO;
  const cx = W * CANNON_X_RATIO;
  const cy = groundY - 25;
  const rad = launchAngle * Math.PI / 180;
  projectile = {
    x: cx + Math.cos(rad) * 50,
    y: cy - Math.sin(rad) * 50,
    vx: Math.cos(rad) * LAUNCH_SPEED,
    vy: -Math.sin(rad) * LAUNCH_SPEED,
    active: true
  };
  projectileTrail = [];
  cannonRecoil = 15;
  // 砲口煙
  for (let i = 0; i < 4; i++) {
    const a = -rad + (Math.random() - 0.5) * 0.5;
    particles.push({ x: projectile.x, y: projectile.y, vx: Math.cos(a)*2, vy: Math.sin(a)*2-1, life: 0.6, color: '#888', size: 5+Math.random()*4 });
  }
  playFireSound();
}

function updateProjectile(dt, W, H) {
  if (!projectile || !projectile.active) return;
  const groundY = H * GROUND_RATIO;

  projectile.vy += GRAVITY * dt;
  projectile.x += projectile.vx * dt;
  projectile.y += projectile.vy * dt;

  // トレイル記録
  projectileTrail.push({ x: projectile.x, y: projectile.y });
  if (projectileTrail.length > 10) projectileTrail.shift();

  // 直撃判定
  const mx = W * monster.dist;
  const my = groundY - MONSTER_HIT_RADIUS;
  const dx = projectile.x - mx;
  const dy = projectile.y - my;
  if (Math.sqrt(dx*dx + dy*dy) < MONSTER_HIT_RADIUS) {
    projectile.active = false;
    spawnExplosion(projectile.x, projectile.y, monster.color, true);
    onHit();
    return;
  }

  // 地面衝突
  if (projectile.y >= groundY) {
    const landX = projectile.x;
    projectile.active = false;
    spawnExplosion(landX, groundY, '#888888', false);
    onMiss(landX, W);
    return;
  }

  // 画面外
  if (projectile.x > W + 50) {
    projectile.active = false;
    onMiss(projectile.x, W);
  }
}

// ============ COMBAT ============
function onHit() {
  monster.hp = Math.max(0, monster.hp - HIT_DAMAGE);
  monsterHitAnim = 1.0;
  streak++;
  maxStreak = Math.max(maxStreak, streak);
  streakEl.textContent = streak;

  if (streak >= 3) {
    showDamage('x' + streak + ' ' + HIT_DAMAGE, '#ff0');
  } else {
    showDamage(HIT_DAMAGE + '', monster.color);
  }
  playHitSound();

  // Juice
  shakeIntensity = 10;
  shakeDecay = 0.85;
  hitFlashTimer = 3;

  if (monster.hp <= 0) {
    monsterDeadAnim = 1.0;
    floorClearAnim = 1.0;
    floorClearName = monster.name;
    shakeIntensity = 16;
    // 撃破パーティクル
    const mx = gameCanvas.width * monster.dist;
    const my = gameCanvas.height * GROUND_RATIO - 35;
    for (let i = 0; i < 20; i++) {
      const a = Math.random() * Math.PI * 2;
      const spd = 3 + Math.random() * 7;
      particles.push({ x: mx, y: my, vx: Math.cos(a)*spd, vy: Math.sin(a)*spd-4, life: 1.2, color: monster.color, size: 4+Math.random()*5 });
    }
    playDefeatSound();
    saveRecords();
    setTimeout(() => {
      floor++;
      floorEl.textContent = floor;
      monster = getMonsterDef(floor);
      monsterDeadAnim = 0;
      angleLocked = false;
      lastStableAngle = -1;
      saveRecords();
    }, 2000);
  }
}

function onMiss(landX, W) {
  streak = Math.max(0, streak - 1); // リセットではなく-1
  streakEl.textContent = streak;
  shakeIntensity = 3;
  shakeDecay = 0.8;

  const mx = W * monster.dist;
  const diff = landX - mx;
  if (diff < -MONSTER_HIT_RADIUS * 1.5) {
    showDamage('おしい！もう少し深く曲げてみて', '#f84');
  } else if (diff < -MONSTER_HIT_RADIUS) {
    showDamage('あと少し！', '#fa0');
  } else if (diff > MONSTER_HIT_RADIUS * 1.5) {
    showDamage('おしい！少し浅めに曲げてみて', '#48f');
  } else if (diff > MONSTER_HIT_RADIUS) {
    showDamage('あと少し！', '#4af');
  } else {
    showDamage('おしい！', '#fff8');
  }
  playMissSound();
}

let restPromptTimer = 0;
function showRestPrompt() {
  restPromptTimer = 180; // 3秒間表示 (60fps × 3)
}

function showDamage(text, color) {
  damageEl.textContent = text;
  damageEl.style.color = color;
  damageEl.style.textShadow = '0 0 20px ' + color;
  damageEl.style.opacity = '1';
  damageEl.style.transform = 'translate(-50%,-60%) scale(1.2)';
  setTimeout(() => {
    damageEl.style.opacity = '0';
    damageEl.style.transform = 'translate(-50%,-80%) scale(0.8)';
  }, 1200);
}

// ============ EXPLOSION ============
function spawnExplosion(x, y, color, isHit) {
  if (isHit) {
    explosions.push({ x, y, life: 1.0, phase: 'core', size: 50, color });
    explosions.push({ x, y, life: 1.0, phase: 'ring', size: 0, color });
    setTimeout(() => explosions.push({ x, y, life: 0.7, phase: 'ring', size: 0, color }), 80);
    for (let i = 0; i < 20; i++) {
      const a = Math.random() * Math.PI * 2;
      const spd = 3 + Math.random() * 6;
      particles.push({ x, y, vx: Math.cos(a)*spd, vy: Math.sin(a)*spd-3, life: 1, color: i<8?'#fff':color, size: 2+Math.random()*5 });
    }
    for (let i = 0; i < 6; i++) {
      const a = Math.random() * Math.PI * 2;
      particles.push({ x, y, vx: Math.cos(a)*0.8, vy: -1-Math.random()*2, life: 1.2, color: '#444', size: 8+Math.random()*6 });
    }
    playExplosionSound();
  } else {
    explosions.push({ x, y, life: 0.7, phase: 'core', size: 20, color: '#888888' });
    for (let i = 0; i < 6; i++) {
      const a = -Math.PI * Math.random();
      const spd = 1.5 + Math.random() * 3;
      particles.push({ x, y, vx: Math.cos(a)*spd, vy: Math.sin(a)*spd-1, life: 0.7, color: '#aa8855', size: 2+Math.random()*3 });
    }
  }
}

// ============ DRAWING: BACKGROUND ============
function drawBackground(ctx, W, H, now) {
  const groundY = H * GROUND_RATIO;

  // 空 (暖色トワイライト)
  const sky = ctx.createLinearGradient(0, 0, 0, groundY);
  sky.addColorStop(0, '#0e0828');
  sky.addColorStop(0.4, '#1a1040');
  sky.addColorStop(0.75, '#2d1848');
  sky.addColorStop(1, '#3a2030');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, groundY);

  // 星
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 50; i++) {
    const sx = ((42*(i+1)*7)%1000)/1000 * W;
    const sy = ((42*(i+1)*13)%1000)/1000 * groundY * 0.6;
    ctx.globalAlpha = 0.3 + Math.sin(now*0.001+i)*0.2;
    ctx.fillRect(sx, sy, 1.5, 1.5);
  }
  ctx.globalAlpha = 1;

  // 遠景の山
  ctx.fillStyle = '#1e1430';
  ctx.beginPath();
  ctx.moveTo(0, groundY);
  for (let x = 0; x <= W; x += 60) {
    const h = 35 + Math.sin(x*0.005+1)*28 + Math.sin(x*0.012)*18;
    ctx.lineTo(x, groundY - h);
  }
  ctx.lineTo(W, groundY);
  ctx.fill();

  // 地面
  const gnd = ctx.createLinearGradient(0, groundY, 0, H);
  gnd.addColorStop(0, '#2e3e22');
  gnd.addColorStop(0.4, '#222e18');
  gnd.addColorStop(1, '#0e1408');
  ctx.fillStyle = gnd;
  ctx.fillRect(0, groundY, W, H-groundY);

  // 地面ライン
  ctx.strokeStyle = '#4a7a30';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, groundY);
  ctx.lineTo(W, groundY);
  ctx.stroke();

  // 草
  for (let i = 0; i < 60; i++) {
    const gx = ((37*(i+1)*11)%1000)/1000 * W;
    const gh = 4 + ((i*7)%5);
    ctx.strokeStyle = ['#3a5a20','#4a6a30','#5a8a40'][i%3];
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(gx, groundY);
    ctx.lineTo(gx + ((i%2)?2:-2), groundY - gh);
    ctx.stroke();
  }

  // 距離目盛り
  ctx.font = '10px Orbitron';
  ctx.textAlign = 'center';
  for (let i = 1; i <= 8; i++) {
    const gx = W * (0.08 + i * 0.1);
    ctx.fillStyle = '#4a6a3050';
    ctx.fillRect(gx, groundY, 1, 6);
    ctx.fillStyle = '#fff3';
    ctx.fillText(i*10+'m', gx, groundY+16);
  }
}

// ============ DRAWING: TARGET ZONE ============
function drawTargetZone(ctx, W, H) {
  if (!monster || monster.hp <= 0 || !gameRunning) return;
  const groundY = H * GROUND_RATIO;
  const mx = W * monster.dist;
  // 地面上のターゲットゾーン
  ctx.save();
  ctx.globalAlpha = 0.25;
  ctx.fillStyle = monster.color;
  ctx.fillRect(mx - MONSTER_HIT_RADIUS, groundY - 2, MONSTER_HIT_RADIUS * 2, 4);
  ctx.globalAlpha = 0.08;
  ctx.fillRect(mx - MONSTER_HIT_RADIUS, groundY - 30, MONSTER_HIT_RADIUS * 2, 30);
  ctx.restore();
}

// ============ DRAWING: CANNON ============
function drawCannon(ctx, W, H, now) {
  const groundY = H * GROUND_RATIO;
  const cx = W * CANNON_X_RATIO;
  const cy = groundY;
  const rad = launchAngle * Math.PI / 180;

  ctx.save();

  // 台座
  ctx.fillStyle = '#3a3a3a';
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cx, cy, 22, Math.PI, 0);
  ctx.fill(); ctx.stroke();

  // 車輪
  ctx.fillStyle = '#2a2a2a';
  ctx.strokeStyle = '#4a4a4a';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(cx-12, cy, 14, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx+12, cy, 14, 0, Math.PI*2); ctx.fill(); ctx.stroke();

  // 砲身
  ctx.save();
  ctx.translate(cx, cy - 16);
  ctx.rotate(-rad);

  if (angleLocked) {
    ctx.shadowColor = '#ff0';
    ctx.shadowBlur = 14 + Math.sin(now*0.01)*5;
  }

  const recoilOffset = -cannonRecoil;
  ctx.fillStyle = angleLocked ? '#887730' : '#4a4a4a';
  ctx.strokeStyle = angleLocked ? '#ff0' : '#777';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.rect(recoilOffset, -8, 50, 16);
  ctx.fill(); ctx.stroke();

  // 砲口
  ctx.fillStyle = angleLocked ? '#aa9940' : '#555';
  ctx.fillRect(recoilOffset + 44, -10, 6, 20);

  // マズルフラッシュ
  if (cannonRecoil > 10) {
    ctx.shadowColor = '#ff0';
    ctx.shadowBlur = 20;
    ctx.fillStyle = '#fff';
    ctx.globalAlpha = (cannonRecoil - 10) / 5;
    ctx.beginPath();
    ctx.arc(recoilOffset + 54, 0, 10, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  ctx.restore();

  // 角度表示
  ctx.font = '900 16px Orbitron';
  ctx.textAlign = 'center';
  ctx.fillStyle = angleLocked ? '#ff0' : '#fffc';
  ctx.shadowColor = angleLocked ? '#ff0' : 'transparent';
  ctx.shadowBlur = angleLocked ? 8 : 0;
  ctx.fillText(Math.round(launchAngle) + '°', cx, cy - 56);

  // ロックゲージ (大きいリング)
  if (poseState === 'down' && !angleLocked && gameRunning && !(projectile && projectile.active)) {
    const elapsed = lastStableAngle >= 0 ? performance.now() - angleStableStart : 0;
    const progress = Math.min(1, elapsed / LOCK_TIME);
    // 背景リング
    ctx.beginPath();
    ctx.arc(cx, cy - 72, 22, 0, Math.PI*2);
    ctx.strokeStyle = '#fff2';
    ctx.lineWidth = 4;
    ctx.shadowBlur = 0;
    ctx.stroke();
    // 進捗リング
    ctx.beginPath();
    ctx.arc(cx, cy - 72, 22, -Math.PI/2, -Math.PI/2 + progress * Math.PI*2);
    ctx.strokeStyle = progress > 0.8 ? '#ff0' : '#f80';
    ctx.lineWidth = 5;
    ctx.stroke();
    // 残り秒数
    ctx.font = '700 12px Orbitron';
    ctx.fillStyle = '#fffc';
    ctx.shadowBlur = 0;
    ctx.fillText(((LOCK_TIME - elapsed)/1000).toFixed(1), cx, cy - 68);
  }

  if (angleLocked && poseState === 'down') {
    // ロック済みバッジ
    ctx.shadowBlur = 0;
    const badgeW = 80, badgeH = 24;
    ctx.fillStyle = '#ff0';
    ctx.globalAlpha = 0.15;
    ctx.beginPath();
    ctx.roundRect(cx - badgeW/2, cy - 88, badgeW, badgeH, 6);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = '#ff0';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.font = '700 13px Orbitron';
    ctx.fillStyle = '#ff0';
    ctx.fillText('LOCKED!', cx, cy - 72);
    // 指示
    ctx.font = '600 14px Rajdhani';
    ctx.fillStyle = '#ff0c';
    ctx.fillText('↑ 腕を伸ばして発射！', cx, cy - 100);
  }

  ctx.restore();
}

// ============ DRAWING: TRAJECTORY ============
function drawTrajectory(ctx, W, H) {
  if (!gameRunning || !monster || monster.hp <= 0) return;
  if (projectile && projectile.active) return;
  if (poseState !== 'down') return;

  const groundY = H * GROUND_RATIO;
  const cx = W * CANNON_X_RATIO;
  const cy = groundY - 25;
  const rad = launchAngle * Math.PI / 180;

  const vx = Math.cos(rad) * LAUNCH_SPEED;
  const vy = -Math.sin(rad) * LAUNCH_SPEED;
  const sx = cx + Math.cos(rad) * 50;
  const sy = cy - Math.sin(rad) * 50;

  // 着弾点を先に計算
  let lx = sx, ly = sy;
  const dt = 0.02;
  for (let t = dt; t < 5; t += dt) {
    lx = sx + vx * t;
    ly = sy + vy * t + 0.5 * GRAVITY * t * t;
    if (ly >= groundY || lx > W) break;
  }

  // 着弾点がターゲットゾーン内か判定
  const mx = W * monster.dist;
  const onTarget = Math.abs(lx - mx) < MONSTER_HIT_RADIUS;

  ctx.save();
  ctx.setLineDash([6, 6]);
  if (angleLocked) {
    ctx.strokeStyle = onTarget ? 'rgba(0,255,100,0.6)' : 'rgba(255,255,0,0.5)';
    ctx.lineWidth = 3;
    ctx.shadowColor = onTarget ? '#0f0' : '#ff0';
    ctx.shadowBlur = 5;
  } else {
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 2;
  }

  ctx.beginPath();
  ctx.moveTo(sx, sy);
  for (let t = dt; t < 4; t += dt) {
    const px = sx + vx * t;
    const py = sy + vy * t + 0.5 * GRAVITY * t * t;
    if (py > groundY || px > W) break;
    ctx.lineTo(px, py);
  }
  ctx.stroke();

  // 着弾点マーカー (十字)
  if (ly >= groundY - 5) {
    ctx.setLineDash([]);
    const crossSize = angleLocked ? 10 : 6;
    ctx.strokeStyle = angleLocked ? (onTarget ? '#0f08' : '#ff08') : '#fff3';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(lx - crossSize, groundY); ctx.lineTo(lx + crossSize, groundY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(lx, groundY - crossSize); ctx.lineTo(lx, groundY + crossSize); ctx.stroke();
  }

  ctx.restore();
}

// ============ DRAWING: PROJECTILE (with trail) ============
function drawProjectile(ctx) {
  if (!projectile || !projectile.active) return;
  ctx.save();
  // トレイル
  for (let i = 0; i < projectileTrail.length; i++) {
    const t = projectileTrail[i];
    const ratio = i / projectileTrail.length;
    ctx.globalAlpha = ratio * 0.4;
    ctx.fillStyle = '#f80';
    ctx.beginPath();
    ctx.arc(t.x, t.y, 4 * ratio, 0, Math.PI*2);
    ctx.fill();
  }
  // メイン砲弾
  ctx.globalAlpha = 1;
  ctx.shadowColor = '#f80';
  ctx.shadowBlur = 16;
  ctx.fillStyle = '#f80';
  ctx.beginPath();
  ctx.arc(projectile.x, projectile.y, 8, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fc0';
  ctx.beginPath();
  ctx.arc(projectile.x, projectile.y, 4, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

// ============ DRAWING: EXPLOSIONS ============
function updateExplosions(ctx) {
  for (let i = explosions.length-1; i >= 0; i--) {
    const e = explosions[i];
    e.life -= 0.025;
    if (e.life <= 0) { explosions.splice(i,1); continue; }
    ctx.save();
    if (e.phase === 'core') {
      const progress = 1 - e.life;
      const r = e.size * (0.3 + progress * 0.7);
      ctx.globalAlpha = e.life;
      ctx.shadowColor = e.color;
      ctx.shadowBlur = 30 * e.life;
      const grad = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, r);
      grad.addColorStop(0, '#fff');
      grad.addColorStop(0.2, '#ffe080');
      grad.addColorStop(0.5, e.color);
      grad.addColorStop(0.8, e.color + '60');
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(e.x, e.y, r, 0, Math.PI*2);
      ctx.fill();
    } else if (e.phase === 'ring') {
      const progress = 1 - e.life;
      const r = 20 + progress * 80;
      ctx.globalAlpha = e.life * 0.7;
      ctx.strokeStyle = e.color;
      ctx.lineWidth = Math.max(1, 4 * e.life);
      ctx.shadowColor = e.color;
      ctx.shadowBlur = 12 * e.life;
      ctx.beginPath();
      ctx.arc(e.x, e.y, r, 0, Math.PI*2);
      ctx.stroke();
    }
    ctx.restore();
  }
}

// ============ MONSTER DRAWING ============
function drawMonster(ctx, W, H, now) {
  if (!monster) return;
  const groundY = H * GROUND_RATIO;
  const cx = W * monster.dist;
  const cy = groundY;
  const size = 70;
  const shakeX = monsterHitAnim > 0 ? (Math.random()-0.5)*18*monsterHitAnim : 0;
  const shakeY = monsterHitAnim > 0 ? (Math.random()-0.5)*8*monsterHitAnim : 0;
  const mx = cx + shakeX, my = cy + shakeY;

  if (monsterHitAnim > 0) monsterHitAnim = Math.max(0, monsterHitAnim-0.03);

  ctx.save();
  if (monsterDeadAnim > 0) {
    ctx.globalAlpha = monsterDeadAnim;
    monsterDeadAnim = Math.max(0, monsterDeadAnim-0.02);
  }

  ctx.shadowColor = monster.color;
  ctx.shadowBlur = 16 + Math.sin(now*0.005)*6;
  ctx.strokeStyle = monster.color;
  ctx.fillStyle = monster.color + '80';  // 不透明度UP (30→80)
  ctx.lineWidth = 3;

  const t = monster.type;
  if (t==='slime') drawSlime(ctx, mx, my-size*0.35, size, now);
  else if (t==='goblin') drawGoblin(ctx, mx, my-size*0.45, size, now);
  else if (t==='skeleton') drawSkeleton2(ctx, mx, my-size*0.45, size, now);
  else if (t==='wolf') drawWolf(ctx, mx, my-size*0.3, size, now);
  else if (t==='dragon') drawDragon(ctx, mx, my-size*0.5, size, now);

  ctx.restore();

  // HPバー (大きめ)
  drawHPBar(ctx, cx, cy-size*1.3, monster);

  // 名前
  ctx.save();
  ctx.font = '700 20px Rajdhani';
  ctx.fillStyle = monster.color;
  ctx.textAlign = 'center';
  ctx.shadowColor = monster.color;
  ctx.shadowBlur = 6;
  ctx.fillText(monster.name, cx, cy-size*1.4-8);
  ctx.restore();
}

function drawSlime(ctx,x,y,s,now) {
  const w = Math.sin(now*0.004)*5;
  ctx.beginPath();
  ctx.moveTo(x-s*0.38, y+s*0.12);
  ctx.quadraticCurveTo(x-s*0.42, y-s*0.22+w, x, y-s*0.35);
  ctx.quadraticCurveTo(x+s*0.42, y-s*0.22-w, x+s*0.38, y+s*0.12);
  ctx.quadraticCurveTo(x, y+s*0.2, x-s*0.38, y+s*0.12);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(x-10,y-6,5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+10,y-6,5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#000';
  ctx.beginPath(); ctx.arc(x-8,y-4,2.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+12,y-4,2.5,0,Math.PI*2); ctx.fill();
}

function drawGoblin(ctx,x,y,s,now) {
  ctx.beginPath(); ctx.ellipse(x,y+6,s*0.22,s*0.32,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(x,y-s*0.28,s*0.18,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x-s*0.18,y-s*0.32); ctx.lineTo(x-s*0.36,y-s*0.55); ctx.lineTo(x-s*0.1,y-s*0.35); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+s*0.18,y-s*0.32); ctx.lineTo(x+s*0.36,y-s*0.55); ctx.lineTo(x+s*0.1,y-s*0.35); ctx.stroke();
  ctx.fillStyle='#f00';
  ctx.beginPath(); ctx.arc(x-7,y-s*0.3,3.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+7,y-s*0.3,3.5,0,Math.PI*2); ctx.fill();
}

function drawSkeleton2(ctx,x,y,s,now) {
  ctx.beginPath(); ctx.arc(x,y-s*0.28,s*0.16,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x-s*0.1,y-s*0.15); ctx.lineTo(x,y-s*0.07); ctx.lineTo(x+s*0.1,y-s*0.15); ctx.stroke();
  ctx.fillStyle=monster.color;
  ctx.beginPath(); ctx.arc(x-7,y-s*0.31,4,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+7,y-s*0.31,4,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x,y-s*0.1); ctx.lineTo(x,y+s*0.22); ctx.stroke();
  for (let i=0;i<3;i++) {
    const ry=y-s*0.03+i*12;
    ctx.beginPath(); ctx.moveTo(x-s*0.18,ry+3); ctx.quadraticCurveTo(x,ry-3,x+s*0.18,ry+3); ctx.stroke();
  }
  ctx.beginPath(); ctx.moveTo(x,y-s*0.07); ctx.lineTo(x-s*0.3,y+s*0.06); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x,y-s*0.07); ctx.lineTo(x+s*0.3,y+s*0.06); ctx.stroke();
}

function drawWolf(ctx,x,y,s,now) {
  ctx.beginPath(); ctx.ellipse(x,y+6,s*0.35,s*0.22,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(x-s*0.28,y-s*0.1,s*0.15,s*0.13,-0.3,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x-s*0.35,y-s*0.22); ctx.lineTo(x-s*0.42,y-s*0.44); ctx.lineTo(x-s*0.26,y-s*0.24); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x-s*0.22,y-s*0.24); ctx.lineTo(x-s*0.26,y-s*0.44); ctx.lineTo(x-s*0.15,y-s*0.22); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#f00';
  ctx.beginPath(); ctx.arc(x-s*0.3,y-s*0.14,3.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x+s*0.3,y-1); ctx.quadraticCurveTo(x+s*0.5,y-s*0.22,x+s*0.42,y-s*0.38); ctx.stroke();
}

function drawDragon(ctx,x,y,s,now) {
  ctx.beginPath(); ctx.ellipse(x,y+3,s*0.32,s*0.27,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(x,y-s*0.32,s*0.15,s*0.14,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x-10,y-s*0.43); ctx.lineTo(x-18,y-s*0.65); ctx.lineTo(x-3,y-s*0.43); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+10,y-s*0.43); ctx.lineTo(x+18,y-s*0.65); ctx.lineTo(x+3,y-s*0.43); ctx.stroke();
  const wf = Math.sin(now*0.006)*10;
  ctx.beginPath(); ctx.moveTo(x-s*0.23,y-s*0.07); ctx.lineTo(x-s*0.6,y-s*0.38+wf); ctx.lineTo(x-s*0.45,y-s*0.07+wf*0.5); ctx.lineTo(x-s*0.23,y+s*0.07); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+s*0.23,y-s*0.07); ctx.lineTo(x+s*0.6,y-s*0.38+wf); ctx.lineTo(x+s*0.45,y-s*0.07+wf*0.5); ctx.lineTo(x+s*0.23,y+s*0.07); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#ff0';
  ctx.beginPath(); ctx.arc(x-7,y-s*0.35,3.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+7,y-s*0.35,3.5,0,Math.PI*2); ctx.fill();
}

function drawHPBar(ctx,x,y,mon) {
  const w=160, h=14;
  const ratio = mon.hp/mon.maxHp;
  ctx.save();
  // 背景パネル
  ctx.fillStyle='#0008';
  ctx.fillRect(x-w/2-3,y-3,w+6,h+6);
  ctx.fillStyle='#fff1';
  ctx.fillRect(x-w/2,y,w,h);
  const c = ratio>0.5?mon.color:ratio>0.25?'#ff0':'#f44';
  ctx.fillStyle=c; ctx.shadowColor=c; ctx.shadowBlur=6;
  ctx.fillRect(x-w/2,y,w*ratio,h);
  ctx.strokeStyle='#fff4'; ctx.lineWidth=1;
  ctx.strokeRect(x-w/2,y,w,h);
  ctx.shadowBlur=0;
  ctx.font='700 11px Orbitron'; ctx.fillStyle='#fff';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(mon.hp+' / '+mon.maxHp, x, y+h/2+1);
  ctx.restore();
}

// ============ PARTICLES ============
function updateParticles(ctx) {
  for (let i=particles.length-1; i>=0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life -= 0.02;
    if (p.life<=0) { particles.splice(i,1); continue; }
    ctx.save();
    ctx.globalAlpha = Math.min(1, p.life);
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 5;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size*Math.min(1,p.life), 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

// ============ FLOOR CLEAR BANNER ============
function drawFloorClear(ctx, W, H) {
  if (floorClearAnim <= 0) return;
  ctx.save();
  ctx.globalAlpha = Math.min(1, floorClearAnim);

  // 背景バナー
  const bannerH = 80;
  const cy = H * 0.35;
  ctx.fillStyle = '#0009';
  ctx.fillRect(0, cy - bannerH/2, W, bannerH);

  // ライン
  const lineW = W * 0.4 * (1 - floorClearAnim * 0.3);
  ctx.strokeStyle = '#ff0';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(W/2 - lineW, cy - bannerH/2 + 2); ctx.lineTo(W/2 + lineW, cy - bannerH/2 + 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W/2 - lineW, cy + bannerH/2 - 2); ctx.lineTo(W/2 + lineW, cy + bannerH/2 - 2); ctx.stroke();

  // テキスト
  ctx.font = '900 32px Orbitron';
  ctx.fillStyle = '#ff0';
  ctx.textAlign = 'center';
  ctx.shadowColor = '#ff0';
  ctx.shadowBlur = 15;
  ctx.fillText('FLOOR ' + floor + ' CLEAR!', W/2, cy + 5);

  // 撃破モンスター名
  ctx.font = '500 16px Rajdhani';
  ctx.fillStyle = '#fff8';
  ctx.shadowBlur = 0;
  ctx.fillText(floorClearName + ' を撃破！', W/2, cy + 28);

  ctx.restore();
  floorClearAnim -= 0.008;
}

// ============ GUIDE UI ============
function drawGuide(ctx, W, H) {
  if (!gameRunning || !monster || monster.hp<=0) return;
  ctx.save();
  const cx = W * 0.22, cy = H - 36;

  // 背景パネル
  ctx.fillStyle = '#0006';
  ctx.beginPath();
  ctx.roundRect(cx - 90, cy - 22, 180, 44, 8);
  ctx.fill();

  ctx.textAlign = 'center';

  if (projectile && projectile.active) {
    ctx.font = '600 15px Rajdhani';
    ctx.fillStyle = '#f80';
    ctx.fillText('砲弾飛行中...', cx, cy + 5);
  } else if (poseState === 'down') {
    if (angleLocked) {
      ctx.font = '700 16px Orbitron';
      ctx.fillStyle = '#ff0';
      ctx.fillText('FIRE!', cx, cy - 2);
      ctx.font = '600 13px Rajdhani';
      ctx.fillStyle = '#ff0a';
      ctx.fillText('腕を伸ばせ！', cx, cy + 16);
    } else {
      ctx.font = '600 15px Rajdhani';
      ctx.fillStyle = '#fffc';
      ctx.fillText('いい感じ！キープ！', cx, cy - 2);
      ctx.fillStyle = '#fff8';
      ctx.fillText('そのまま腕を伸ばしてもOK', cx, cy + 16);
    }
  } else {
    ctx.font = '600 15px Rajdhani';
    ctx.fillStyle = '#fff8';
    ctx.fillText('腕を曲げてみよう！', cx, cy - 2);
    ctx.fillStyle = '#fff6';
    ctx.fillText('曲げ具合で狙いが変わる', cx, cy + 16);
  }
  ctx.restore();
}

// ============ GAME LOOP ============
let lastFrameTime = 0;

function gameLoop(now) {
  if (!gameRunning) return;
  const dt = lastFrameTime ? Math.min((now-lastFrameTime)/1000, 0.05) : 0.016;
  lastFrameTime = now;

  // Juice decay
  cannonRecoil *= 0.88; if (cannonRecoil < 0.3) cannonRecoil = 0;

  const W = gameCanvas.width, H = gameCanvas.height;
  gCtx.clearRect(0, 0, W, H);

  // 画面シェイク
  gCtx.save();
  if (shakeIntensity > 0.5) {
    const sx = (Math.random()-0.5) * 2 * shakeIntensity;
    const sy = (Math.random()-0.5) * 2 * shakeIntensity;
    gCtx.translate(sx, sy);
    shakeIntensity *= shakeDecay;
    if (shakeIntensity < 0.5) shakeIntensity = 0;
  }

  drawBackground(gCtx, W, H, now);
  drawTargetZone(gCtx, W, H);
  drawTrajectory(gCtx, W, H);
  drawMonster(gCtx, W, H, now);
  drawCannon(gCtx, W, H, now);
  drawProjectile(gCtx);
  updateProjectile(dt, W, H);
  updateExplosions(gCtx);
  updateParticles(gCtx);

  gCtx.restore(); // シェイク終了

  // ヒットフラッシュ (シェイク外で描画)
  if (hitFlashTimer > 0) {
    gCtx.save();
    gCtx.globalAlpha = 0.3;
    gCtx.fillStyle = '#fff';
    gCtx.fillRect(0, 0, W, H);
    gCtx.restore();
    hitFlashTimer--;
  }

  drawFloorClear(gCtx, W, H);
  drawGuide(gCtx, W, H);

  // 休憩プロンプト
  if (restPromptTimer > 0) {
    restPromptTimer--;
    gCtx.save();
    gCtx.globalAlpha = Math.min(1, restPromptTimer / 30);
    const rpY = H * 0.55;
    gCtx.fillStyle = '#0009';
    gCtx.beginPath();
    gCtx.roundRect(W/2 - 160, rpY - 28, 320, 56, 10);
    gCtx.fill();
    gCtx.font = '700 20px Rajdhani';
    gCtx.fillStyle = '#0f0';
    gCtx.textAlign = 'center';
    gCtx.fillText(totalReps + '回達成！無理せず休憩してね', W/2, rpY + 6);
    gCtx.restore();
  }

  requestAnimationFrame(gameLoop);
}

// ============ START ============
function startGame() {
  initAudio();
  floor = 1;
  totalReps = 0;
  streak = 0;
  maxStreak = 0;
  floorEl.textContent = floor;
  repEl.textContent = '0';
  streakEl.textContent = '0';

  monster = getMonsterDef(floor);
  particles = [];
  explosions = [];
  projectile = null;
  projectileTrail = [];
  monsterHitAnim = 0;
  monsterDeadAnim = 0;
  angleLocked = false;
  lastStableAngle = -1;
  shakeIntensity = 0;
  cannonRecoil = 0;
  hitFlashTimer = 0;
  floorClearAnim = 0;
  lastFrameTime = 0;

  startScreen.style.display = 'none';
  gameRunning = true;
  requestAnimationFrame(gameLoop);
}

document.getElementById('startBtn').addEventListener('click', startGame);
loadRecords();
initPose();
})();
</script>
