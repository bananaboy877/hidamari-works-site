<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Table Hockey - Hidamari Works</title>
<style>
:root {
  --r-md: 8px;
  --r-lg: 12px;
  --bg-primary: #ffffff;
  --bg-secondary: #f3f2ec;
  --bg-tertiary: #e7e5dd;
  --bg-info: #e6f1fb;
  --bg-warning: #faeeda;
  --text-primary: #2c2c2a;
  --text-secondary: #5f5e5a;
  --text-tertiary: #888780;
  --text-info: #185fa5;
  --text-warning: #854f0b;
  --border-tertiary: rgba(0,0,0,0.15);
  --border-info: #378add;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg-primary: #1a1a18;
    --bg-secondary: #2c2c2a;
    --bg-tertiary: #3a3a37;
    --bg-info: #042c53;
    --bg-warning: #412402;
    --text-primary: #f0eee6;
    --text-secondary: #b4b2a9;
    --text-tertiary: #888780;
    --text-info: #85b7eb;
    --text-warning: #fac775;
    --border-tertiary: rgba(255,255,255,0.15);
    --border-info: #378add;
  }
}

* { box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", "Segoe UI", sans-serif;
  background: #000;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  justify-content: center;
}

.wrap {
  position: relative;
  width: min(100vw, calc(100vh * 680 / 440));
  aspect-ratio: 680 / 440;
  background: #0a1525;
  overflow: hidden;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

.hud-bottom {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  align-items: center;
  gap: 2%;
  padding: 1.2% 2.2%;
  background: rgba(10, 21, 37, 0.55);
  backdrop-filter: blur(2px);
  font-size: clamp(10px, 1.6vmin, 14px);
  color: rgba(220, 232, 240, 0.85);
}

.gauge {
  flex: 1;
  height: clamp(10px, 2vmin, 18px);
  background: rgba(255, 255, 255, 0.18);
  border-radius: 999px;
  position: relative;
}

.gauge-tick {
  position: absolute;
  top: 0;
  width: 2px;
  height: 100%;
  background: rgba(255, 255, 255, 0.45);
}

.gauge-marker {
  position: absolute;
  top: 50%;
  width: clamp(12px, 2.4vmin, 20px);
  height: clamp(12px, 2.4vmin, 20px);
  background: #85b7eb;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  transition: left .08s linear;
  box-shadow: 0 0 6px rgba(133, 183, 235, 0.6);
}

.deg-label {
  color: rgba(220, 232, 240, 0.55);
  min-width: 3ch;
  text-align: center;
}

.key-hints {
  color: rgba(220, 232, 240, 0.7);
  white-space: nowrap;
}

.key-hints kbd {
  font-family: ui-monospace, "SF Mono", Consolas, monospace;
  font-size: 0.9em;
  padding: 1px 6px;
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.08);
  color: #dde8f0;
}

.gear-btn {
  position: absolute;
  top: 2.2%;
  right: 2.2%;
  width: clamp(36px, 5vmin, 52px);
  height: clamp(36px, 5vmin, 52px);
  border-radius: 50%;
  background: rgba(10, 21, 37, 0.55);
  border: 1px solid rgba(255, 255, 255, 0.25);
  color: #dde8f0;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  transition: background .15s, transform .15s;
}

.gear-btn:hover {
  background: rgba(20, 40, 70, 0.8);
  transform: rotate(30deg);
}

.gear-btn svg {
  width: 60%;
  height: 60%;
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
}

.modal-backdrop.open {
  display: flex;
}

.modal {
  background: var(--bg-primary);
  color: var(--text-primary);
  border-radius: var(--r-lg);
  padding: 22px 24px 24px;
  width: min(420px, 92vw);
  max-height: 90vh;
  overflow: auto;
  position: relative;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.modal-title {
  font-size: 18px;
  font-weight: 500;
  margin: 0;
}

.modal-close {
  background: transparent;
  border: none;
  color: var(--text-secondary);
  font-size: 24px;
  line-height: 1;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: var(--r-md);
}

.modal-close:hover {
  background: var(--bg-secondary);
}

.setting-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px 16px;
  padding: 10px 0;
  border-top: 1px solid var(--border-tertiary);
  font-size: 14px;
}

.setting-row:first-of-type {
  border-top: none;
}

.setting-label {
  flex: 0 0 100%;
  color: var(--text-secondary);
  font-size: 13px;
  margin-bottom: 2px;
}

.setting-row label {
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}

.swatch {
  display: inline-block;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 1px solid rgba(0,0,0,0.35);
  vertical-align: middle;
}

.slider-row {
  display: block;
  padding: 10px 0;
  border-top: 1px solid var(--border-tertiary);
  font-size: 14px;
}

.slider-row .setting-label {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 6px;
}

.slider-row .slider-value {
  font-variant-numeric: tabular-nums;
  color: var(--text-info);
  font-weight: 500;
}

.slider-row input[type="range"] {
  width: 100%;
  accent-color: var(--text-info);
}

.calibrate-btn {
  display: block;
  width: 100%;
  margin-top: 14px;
  padding: 10px 16px;
  background: var(--bg-info);
  color: var(--text-info);
  border: 1px solid var(--border-info);
  border-radius: var(--r-md);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
}

.calibrate-btn:hover {
  filter: brightness(1.05);
}
</style>
</head>
<body>

<div class="wrap" id="wrap">
  <canvas id="game" width="680" height="440"></canvas>

  <button class="gear-btn" id="gearBtn" aria-label="設定">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
  </button>

  <div class="hud-bottom">
    <span class="deg-label">90°</span>
    <div class="gauge">
      <div class="gauge-tick" style="left:50%;"></div>
      <div class="gauge-marker" id="marker" style="left:50%;"></div>
    </div>
    <span class="deg-label">270°</span>
    <span class="key-hints"><kbd>D</kbd> スマッシュ · <kbd>F</kbd> 校正 · <kbd>R</kbd> リセット</span>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <h2 class="modal-title" id="modalTitle">設定</h2>
      <button class="modal-close" id="modalClose" aria-label="閉じる">×</button>
    </div>

    <div class="setting-row">
      <span class="setting-label">CPUの強さ</span>
      <label><input type="radio" name="diff" value="easy"> やさしい</label>
      <label><input type="radio" name="diff" value="normal" checked> ふつう</label>
      <label><input type="radio" name="diff" value="hard"> きびしい</label>
    </div>

    <div class="setting-row">
      <span class="setting-label">パックの色</span>
      <label><input type="radio" name="puckColor" value="white" checked><span class="swatch" style="background:#ffffff"></span>しろ</label>
      <label><input type="radio" name="puckColor" value="black"><span class="swatch" style="background:#2a2a2a"></span>くろ</label>
      <label><input type="radio" name="puckColor" value="yellow"><span class="swatch" style="background:#f4c430"></span>きいろ</label>
      <label><input type="radio" name="puckColor" value="green"><span class="swatch" style="background:#4caf50"></span>みどり</label>
      <label><input type="radio" name="puckColor" value="pink"><span class="swatch" style="background:#ec407a"></span>ピンク</label>
    </div>

    <div class="setting-row">
      <span class="setting-label">ホイール向き</span>
      <label><input type="radio" name="wdir" value="1" checked> 通常</label>
      <label><input type="radio" name="wdir" value="-1"> 反転</label>
    </div>

    <div class="slider-row">
      <div class="setting-label">
        <span>自分のパドルの大きさ</span>
        <span class="slider-value" id="padScaleVal">1.0×</span>
      </div>
      <input type="range" id="padScale" min="0.5" max="2.0" step="0.1" value="1.0">
    </div>

    <div class="slider-row">
      <div class="setting-label">
        <span>スピード倍率 (パック・相手パドル)</span>
        <span class="slider-value" id="spdScaleVal">1.0×</span>
      </div>
      <input type="range" id="spdScale" min="0.5" max="2.0" step="0.1" value="1.0">
    </div>

    <div class="setting-row">
      <label><input type="checkbox" id="rallyAccel" checked> ラリーが続くほどパックが加速 (5回目以降)</label>
    </div>

    <div class="setting-row">
      <label><input type="checkbox" id="soundOn" checked> 効果音を鳴らす</label>
    </div>

    <button class="calibrate-btn" id="calibrateBtn">中心を校正 (F)</button>
  </div>
</div>

<script>
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const W = 680, H = 440;
const marker = document.getElementById('marker');
const gearBtn = document.getElementById('gearBtn');
const modalBackdrop = document.getElementById('modalBackdrop');
const modalClose = document.getElementById('modalClose');
const calibrateBtn = document.getElementById('calibrateBtn');
const padScaleSlider = document.getElementById('padScale');
const spdScaleSlider = document.getElementById('spdScale');
const padScaleVal = document.getElementById('padScaleVal');
const spdScaleVal = document.getElementById('spdScaleVal');

let renderScale = 1;

function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const rect = cv.getBoundingClientRect();
  if (rect.width === 0) return;
  renderScale = (rect.width * dpr) / W;
  cv.width = Math.round(W * renderScale);
  cv.height = Math.round(H * renderScale);
  ctx.setTransform(renderScale, 0, 0, renderScale, 0, 0);
  ctx.imageSmoothingEnabled = true;
}

const HALF = 12;
const PAD_W = 0.18;
const PUCK_R = 0.04;
const INIT_SPEED = 0.0085;
const Z_FRONT = 0.07;
const Z_BACK = 0.93;

const SMASH_DURATION = 18;
const SMASH_FORWARD = 7;
const SMASH_DISTANCE = 0.13;
let smashT = 0;
let padZ = Z_FRONT;

const DIFF = {
  easy:   { aiSpd: 0.0065, returnSpd: 0.0075, jitter: 0.06,  noise: 0.040, delayFr: 10, whiffChance: 0.22, whiffMag: 0.22 },
  normal: { aiSpd: 0.0098, returnSpd: 0.011,  jitter: 0.025, noise: 0.025, delayFr: 5,  whiffChance: 0.10, whiffMag: 0.14 },
  hard:   { aiSpd: 0.014,  returnSpd: 0.016,  jitter: 0.008, noise: 0.012, delayFr: 2,  whiffChance: 0.04, whiffMag: 0.10 }
};
let curDiff = 'normal';
let wheelDir = 1;
let playerPadScale = 1.0;
let speedScale = 1.0;

const PUCK_COLORS = {
  white:  { fill: '#ffffff', stroke: '#888888' },
  black:  { fill: '#2a2a2a', stroke: '#000000' },
  yellow: { fill: '#f4c430', stroke: '#7a5e00' },
  green:  { fill: '#4caf50', stroke: '#1b5e20' },
  pink:   { fill: '#ec407a', stroke: '#880e4f' }
};
let puckColor = 'white';
let rallyAccelEnabled = true;
let rallyHits = 0;
const RALLY_THRESHOLD = 5;
const RALLY_FACTOR = 1.01;

function applyRallyAccel() {
  rallyHits++;
  if (rallyAccelEnabled && rallyHits >= RALLY_THRESHOLD) {
    const mult = Math.pow(RALLY_FACTOR, rallyHits - RALLY_THRESHOLD + 1);
    puck.vz *= mult;
    puck.vx *= mult;
  }
}

let wheelOff = 0;
let padX = 0;
let aiX = 0;
let puck = {x:0, z:0.5, vx:0, vz:0};
let scoreP = 0, scoreA = 0;
let flash = 0;
let calibrated = false;
let pauseT = 90;
let modalOpen = false;
let gameState = 'playing';
let gameOverFrame = 0;
let restartCooldown = 0;
const MATCH_POINT = 10;

let soundEnabled = true;
let audioCtx = null;
const soundBuffers = { paddle: [], wall: [], goal: [], applause: [], cheer: [], win: [], lose: [], restart: [] };
const SOUND_FILES = {
  paddle:   ['audio/paddle_01.wav', 'audio/paddle_02.wav', 'audio/paddle_03.wav'],
  wall:     ['audio/wall_01.wav', 'audio/wall_02.wav', 'audio/wall_03.wav', 'audio/wall_04.wav', 'audio/wall_05.wav', 'audio/wall_06.wav'],
  goal:     ['audio/goal_01.wav'],
  applause: ['audio/applause.wav'],
  cheer:    ['audio/cheer_01.wav', 'audio/cheer_02.wav', 'audio/cheer_03.wav', 'audio/cheer_04.wav'],
  win:      ['audio/voice_win.wav'],
  lose:     ['audio/voice_lose.wav'],
  restart:  ['audio/voice_restart.wav']
};
const SOUND_GAIN = { paddle: 0.6, wall: 0.4, goal: 0.85, applause: 0.7, cheer: 1.0, win: 1.0, lose: 1.0, restart: 1.0 };

function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch (e) {
    console.error('[audio] AudioContext creation failed:', e);
    return;
  }
  console.log('[audio] AudioContext state:', audioCtx.state, 'sampleRate:', audioCtx.sampleRate);

  const silent = audioCtx.createBuffer(1, 1, 22050);
  const us = audioCtx.createBufferSource();
  us.buffer = silent;
  us.connect(audioCtx.destination);
  us.start(0);
  if (audioCtx.state === 'suspended') {
    audioCtx.resume().then(function() { console.log('[audio] resumed →', audioCtx.state); });
  }

  for (const tag of Object.keys(SOUND_FILES)) {
    SOUND_FILES[tag].forEach(function(f) {
      fetch(f)
        .then(function(r) {
          if (!r.ok) throw new Error('HTTP ' + r.status + ' for ' + f);
          return r.arrayBuffer();
        })
        .then(function(b) { return audioCtx.decodeAudioData(b); })
        .then(function(buf) {
          soundBuffers[tag].push(buf);
          console.log('[audio] loaded:', f, '(' + buf.duration.toFixed(2) + 's)');
        })
        .catch(function(e) { console.error('[audio] failed:', f, e.message || e); });
    });
  }
}

function playSound(tag) {
  if (!soundEnabled || !audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const bufs = soundBuffers[tag];
  if (!bufs || bufs.length === 0) return;
  const buf = bufs[Math.floor(Math.random() * bufs.length)];
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const g = audioCtx.createGain();
  g.gain.value = SOUND_GAIN[tag] != null ? SOUND_GAIN[tag] : 1.0;
  src.connect(g).connect(audioCtx.destination);
  src.start();
}

const HIST_LEN = 6;
let padHist = new Array(HIST_LEN).fill(0);
let padV = 0;
let aiJitter = 0;
let aiJitterTimer = 0;
let aiNoise = 0;
let whiffOffset = 0;
const PUCK_HIST_LEN = 16;
let puckXHist = [];

function rollWhiff() {
  const d = DIFF[curDiff];
  if (Math.random() < d.whiffChance) {
    const sign = Math.random() < 0.5 ? -1 : 1;
    const mag = d.whiffMag * (0.5 + Math.random() * 0.5);
    whiffOffset = sign * mag;
  } else {
    whiffOffset = 0;
  }
}

const FG_Y = H * 0.86, BG_Y = H * 0.22;
const FG_HW = W * 0.46, BG_HW = W * 0.16;

function project(x, z) {
  const hw = FG_HW + z * (BG_HW - FG_HW);
  return { x: W/2 + x * hw, y: FG_Y + z * (BG_Y - FG_Y), s: hw / FG_HW };
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function endMatch(outcome) {
  gameState = outcome;
  gameOverFrame = 0;
  restartCooldown = 30;
  puck.vx = 0; puck.vz = 0;
  smashT = 0; padZ = Z_FRONT;
  setTimeout(function() {
    if (gameState === outcome) playSound(outcome);
  }, 600);
  setTimeout(function() {
    if (gameState === outcome) playSound('restart');
  }, 2400);
}

function restartMatch() {
  scoreP = 0;
  scoreA = 0;
  gameState = 'playing';
  reset();
}

function reset() {
  puck.x = 0; puck.z = 0.5;
  const fwd = Math.random() < 0.5;
  const lat = (Math.random() - 0.5) * Math.PI * 0.55;
  const a = fwd ? lat : Math.PI + lat;
  const s = INIT_SPEED * speedScale;
  puck.vz = Math.cos(a) * s;
  puck.vx = Math.sin(a) * s;
  pauseT = 60;
  aiJitter = (Math.random() - 0.5) * 2;
  aiJitterTimer = 30 + Math.random() * 90;
  whiffOffset = 0;
  rallyHits = 0;
  smashT = 0;
  if (puck.vz > 0) rollWhiff();
}

function drawScene() {
  ctx.fillStyle = '#0a1525'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#101e30'; ctx.fillRect(0, 0, W, BG_Y);

  const c = [project(-1,0), project(1,0), project(1,1), project(-1,1)];
  ctx.fillStyle = '#dde8f0';
  ctx.beginPath();
  ctx.moveTo(c[0].x, c[0].y);
  for (let i=1; i<4; i++) ctx.lineTo(c[i].x, c[i].y);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#3a4d63'; ctx.lineWidth = 3; ctx.stroke();

  const cl = project(-1, 0.5), cr = project(1, 0.5);
  ctx.strokeStyle = '#c44'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cl.x, cl.y); ctx.lineTo(cr.x, cr.y); ctx.stroke();

  const cc = project(0, 0.5);
  ctx.strokeStyle = 'rgba(180,30,30,0.4)'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.ellipse(cc.x, cc.y, 50 * cc.s, 18 * cc.s, 0, 0, Math.PI * 2);
  ctx.stroke();

  const flN = project(-0.5, 0.18), frN = project(0.5, 0.18);
  const blN = project(-0.5, 0.82), brN = project(0.5, 0.82);
  ctx.strokeStyle = 'rgba(50,100,180,0.4)'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(flN.x, flN.y); ctx.lineTo(frN.x, frN.y);
  ctx.moveTo(blN.x, blN.y); ctx.lineTo(brN.x, brN.y);
  ctx.stroke();

  const gfl = project(-0.45, 0), gfr = project(0.45, 0);
  const gbl = project(-0.45, 1), gbr = project(0.45, 1);
  ctx.strokeStyle = '#1d4ea5'; ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(gfl.x, gfl.y); ctx.lineTo(gfr.x, gfr.y);
  ctx.moveTo(gbl.x, gbl.y); ctx.lineTo(gbr.x, gbr.y);
  ctx.stroke();
}

function drawDisk(x, z, fill, stroke, rxBase, ryBase) {
  const p = project(x, z);
  const rx = rxBase * p.s, ry = ryBase * p.s;
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(p.x, p.y + 7 * p.s, rx * 0.9, ry * 0.55, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = fill;
  ctx.beginPath();
  ctx.ellipse(p.x, p.y, rx, ry, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = stroke; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.beginPath();
  ctx.ellipse(p.x, p.y - ry * 0.35, rx * 0.7, ry * 0.3, 0, 0, Math.PI * 2);
  ctx.fill();
}

function step() {
  if (gameState !== 'playing') {
    gameOverFrame++;
    if (restartCooldown > 0) restartCooldown--;
    if (flash > 0) flash--;
    return;
  }

  const playerPadW = PAD_W * playerPadScale;
  const playerLimit = 1 - playerPadW;
  const aiLimit = 1 - PAD_W;
  padX = clamp((wheelOff / HALF) * playerLimit, -playerLimit, playerLimit);

  if (smashT > 0) {
    const elapsed = SMASH_DURATION - smashT;
    let p;
    if (elapsed < SMASH_FORWARD) {
      p = elapsed / SMASH_FORWARD;
    } else {
      p = 1 - (elapsed - SMASH_FORWARD) / (SMASH_DURATION - SMASH_FORWARD);
    }
    p = p * p * (3 - 2 * p);
    padZ = Z_FRONT + SMASH_DISTANCE * p;
    smashT--;
  } else {
    padZ = Z_FRONT;
  }

  padHist.push(padX);
  padHist.shift();
  padV = (padX - padHist[0]) / HIST_LEN;

  aiNoise = aiNoise * 0.94 + (Math.random() - 0.5) * 0.4;

  puckXHist.push(puck.x);
  if (puckXHist.length > PUCK_HIST_LEN) puckXHist.shift();

  aiJitterTimer--;
  if (aiJitterTimer <= 0) {
    aiJitter = (Math.random() - 0.5) * 2;
    aiJitterTimer = 30 + Math.random() * 90;
  }

  if (pauseT > 0) {
    pauseT--;
  } else {
    const d = DIFF[curDiff];
    const aiSpd = d.aiSpd * speedScale;
    const returnSpd = d.returnSpd * speedScale;

    const delayFr = Math.min(d.delayFr, puckXHist.length - 1);
    const delayedX = puckXHist[puckXHist.length - 1 - delayFr];

    const target = puck.vz > 0
      ? delayedX + aiJitter * d.jitter + aiNoise * d.noise + whiffOffset
      : aiX * 0.95;
    const dx = target - aiX;
    aiX += clamp(dx, -aiSpd, aiSpd);
    aiX = clamp(aiX, -aiLimit, aiLimit);

    puck.x += puck.vx;
    puck.z += puck.vz;

    if (puck.x <= -1 + PUCK_R) { puck.x = -1 + PUCK_R; puck.vx = -puck.vx; playSound('wall'); }
    else if (puck.x >= 1 - PUCK_R) { puck.x = 1 - PUCK_R; puck.vx = -puck.vx; playSound('wall'); }

    if (puck.vz < 0 && puck.z <= padZ) {
      if (Math.abs(puck.x - padX) <= playerPadW + PUCK_R) {
        puck.z = padZ;
        const incoming = Math.abs(puck.vz);
        const boost = Math.abs(padV) * 0.32;
        const smashing = smashT > 0;
        const cap = (smashing ? 0.045 : 0.030) * speedScale;
        const extra = smashing ? 0.010 : 0;
        puck.vz = Math.min(incoming + boost + extra, cap);
        const hit = (puck.x - padX) / playerPadW;
        puck.vx = clamp(puck.vx + hit * 0.005 + padV * 0.5, -0.020, 0.020);
        applyRallyAccel();
        rollWhiff();
        playSound('paddle');
      }
    }
    if (puck.vz > 0 && puck.z >= Z_BACK) {
      if (Math.abs(puck.x - aiX) <= PAD_W + PUCK_R) {
        puck.z = Z_BACK;
        puck.vz = -returnSpd;
        const hit = (puck.x - aiX) / PAD_W;
        puck.vx = clamp(puck.vx * 0.4 + hit * 0.006, -0.014, 0.014);
        applyRallyAccel();
        playSound('paddle');
      }
    }

    if (puck.z < -0.05) {
      scoreA++; flash = 35;
      playSound('goal');
      if (scoreA >= MATCH_POINT) endMatch('lose');
      else reset();
    } else if (puck.z > 1.05) {
      scoreP++; flash = 35;
      playSound('goal');
      playSound('applause');
      if (scoreP >= MATCH_POINT) {
        endMatch('win');
      } else {
        setTimeout(function() {
          if (gameState === 'playing') playSound('cheer');
        }, 220);
        reset();
      }
    }
  }

  if (flash > 0) flash--;
}

function draw() {
  drawScene();
  drawDisk(aiX, Z_BACK, '#c44a3a', '#5a1810', 38, 14);
  if (gameState === 'playing') {
    const pc = PUCK_COLORS[puckColor];
    drawDisk(puck.x, puck.z, pc.fill, pc.stroke, 24, 9);
  }
  drawDisk(padX, padZ, '#3a7ed8', '#0e2f5a', 38 * playerPadScale, 14 * playerPadScale);

  if (flash > 0) {
    ctx.fillStyle = 'rgba(255,240,150,' + (flash / 80) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  ctx.font = '500 26px sans-serif';
  const scoreY = 40;
  ctx.fillStyle = '#8db4e8';
  ctx.textAlign = 'right';
  ctx.fillText('じぶん ' + scoreP, W/2 - 24, scoreY);
  ctx.fillStyle = '#e8a89a';
  ctx.textAlign = 'left';
  ctx.fillText('あいて ' + scoreA, W/2 + 24, scoreY);

  if (gameState !== 'playing') {
    drawGameOverOverlay();
  } else if (pauseT > 30 && !flash) {
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.font = '500 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(calibrated ? '次のフェイスオフ...' : 'Fキーで中心位置を校正してください', W/2, H/2);
  }
}

function drawGameOverOverlay() {
  const isWin = gameState === 'win';
  const t = gameOverFrame / 60;

  ctx.fillStyle = isWin ? 'rgba(8, 14, 30, 0.50)' : 'rgba(8, 14, 30, 0.62)';
  ctx.fillRect(0, 0, W, H);

  if (isWin) {
    const pulse = (Math.sin(t * 4) + 1) * 0.5;
    const haloR = 150 + pulse * 30;
    const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, haloR);
    grad.addColorStop(0, 'rgba(255, 230, 110, ' + (0.35 + pulse * 0.25) + ')');
    grad.addColorStop(1, 'rgba(255, 230, 110, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }

  ctx.textAlign = 'center';
  if (isWin) {
    ctx.fillStyle = '#ffe170';
    ctx.font = '700 64px sans-serif';
    ctx.fillText('あなたの勝ち！', W/2, H/2);
  } else {
    ctx.fillStyle = '#a8b8cc';
    ctx.font = '700 58px sans-serif';
    ctx.fillText('あいての勝ち！', W/2, H/2);
  }

  if (restartCooldown <= 0) {
    const blink = (Math.sin(t * 2.4) + 1) * 0.5;
    ctx.globalAlpha = 0.55 + blink * 0.45;
    ctx.fillStyle = '#dde8f0';
    ctx.font = '500 22px sans-serif';
    ctx.fillText('レバーを回すともう一度遊べます！', W/2, H/2 + 60);
    ctx.globalAlpha = 1.0;
  }
}

function loop() {
  if (!modalOpen) step();
  draw();
  const pct = ((wheelOff / HALF) + 1) / 2 * 100;
  marker.style.left = clamp(pct, 0, 100) + '%';
  requestAnimationFrame(loop);
}

function calibrate() {
  wheelOff = 0;
  calibrated = true;
}

function openModal() {
  modalOpen = true;
  modalBackdrop.classList.add('open');
}

function closeModal() {
  modalOpen = false;
  modalBackdrop.classList.remove('open');
}

resizeCanvas();
window.addEventListener('resize', resizeCanvas);

reset();
loop();

window.addEventListener('wheel', function(e) {
  if (modalOpen) return;
  e.preventDefault();
  if (gameState !== 'playing') {
    if (restartCooldown <= 0 && Math.abs(e.deltaY) > 0) {
      restartMatch();
    }
    return;
  }
  let inc = Math.round(e.deltaY / 100);
  if (inc === 0) inc = Math.sign(e.deltaY);
  wheelOff = clamp(wheelOff + inc * wheelDir, -HALF, HALF);
}, { passive: false });

document.addEventListener('keydown', function(e) {
  const k = e.key.toLowerCase();
  if (e.key === 'Escape' && modalOpen) {
    e.preventDefault();
    closeModal();
    return;
  }
  if (modalOpen) return;
  if (k === 'f') {
    e.preventDefault();
    calibrate();
  } else if (k === 'r') {
    e.preventDefault();
    restartMatch();
  } else if (k === 'd') {
    e.preventDefault();
    if (gameState === 'playing' && smashT === 0) {
      smashT = SMASH_DURATION;
    }
  }
});

gearBtn.addEventListener('click', openModal);
modalClose.addEventListener('click', closeModal);
modalBackdrop.addEventListener('click', function(e) {
  if (e.target === modalBackdrop) closeModal();
});
calibrateBtn.addEventListener('click', function() {
  calibrate();
  closeModal();
});

document.querySelectorAll('input[name="diff"]').forEach(function(r) {
  r.addEventListener('change', function() {
    if (r.checked) curDiff = r.value;
  });
});

document.querySelectorAll('input[name="wdir"]').forEach(function(r) {
  r.addEventListener('change', function() {
    if (r.checked) wheelDir = parseInt(r.value, 10);
  });
});

document.querySelectorAll('input[name="puckColor"]').forEach(function(r) {
  r.addEventListener('change', function() {
    if (r.checked) puckColor = r.value;
  });
});

padScaleSlider.addEventListener('input', function() {
  playerPadScale = parseFloat(padScaleSlider.value);
  padScaleVal.textContent = playerPadScale.toFixed(1) + '×';
});

spdScaleSlider.addEventListener('input', function() {
  speedScale = parseFloat(spdScaleSlider.value);
  spdScaleVal.textContent = speedScale.toFixed(1) + '×';
});

document.getElementById('rallyAccel').addEventListener('change', function(e) {
  rallyAccelEnabled = e.target.checked;
});

document.getElementById('soundOn').addEventListener('change', function(e) {
  soundEnabled = e.target.checked;
});

function onFirstGesture() {
  initAudio();
  window.removeEventListener('pointerdown', onFirstGesture);
  window.removeEventListener('keydown', onFirstGesture);
  window.removeEventListener('wheel', onFirstGesture);
}
window.addEventListener('pointerdown', onFirstGesture);
window.addEventListener('keydown', onFirstGesture);
window.addEventListener('wheel', onFirstGesture);
</script>
</body>
</html>
