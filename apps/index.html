<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アプリをえらぶ | ひだまりワークス</title>
<meta name="description" content="ひだまりワークスのアプリ一覧。動く絵を見て、やってみたいアプリをえらんでください。ゲーム、メモ、画像加工、3Dプリント用のツールがあります。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>
:root {
  --bg: oklch(95% 0.04 75);
  --bg-dot: oklch(85% 0.06 65 / 0.4);
  --ink: #2b2320;
  --sub: oklch(40% 0.01 60);
  --panel: #fff;
  --accent: oklch(72% 0.15 55);
  --accent-deep: oklch(50% 0.12 55);
  --highlight: oklch(88% 0.12 75);
  --tag-bg: oklch(94% 0.04 70);
  --logo-fill: oklch(80% 0.14 75);
  --shadow-base: 4px 5px 0 var(--ink);
  --shadow-hover: 6px 9px 0 var(--ink);
  --ease: cubic-bezier(.34, 1.56, .64, 1);
  --radius-card: 24px;
  --radius-pill: 999px;
  --container-w: 1200px;
  --container-pad: 32px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", -apple-system, BlinkMacSystemFont, sans-serif;
  font-weight: 500;
  -webkit-font-smoothing: antialiased;
  line-height: 1.6;
}
body {
  background-image: radial-gradient(var(--bg-dot) 1.2px, transparent 1.2px);
  background-size: 16px 16px;
  min-height: 100vh;
  overflow-x: hidden;
}
a { color: inherit; }
.container { max-width: var(--container-w); margin: 0 auto; padding: 0 var(--container-pad); }

/* Nav */
.nav {
  margin: 20px auto 0;
  max-width: calc(var(--container-w) - var(--container-pad) * 2);
  padding: 12px 22px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  background: var(--panel);
  border: 2px solid var(--ink);
  border-radius: var(--radius-pill);
  box-shadow: var(--shadow-base);
}
.nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.nav-logo {
  width: 30px; height: 30px; flex-shrink: 0;
  background: var(--logo-fill);
  border: 2px solid var(--ink); border-radius: 50%;
  position: relative;
}
.nav-logo::before, .nav-logo::after {
  content: ''; position: absolute; top: 9px;
  width: 4px; height: 4px; border-radius: 50%; background: var(--ink);
}
.nav-logo::before { left: 7px; }
.nav-logo::after { right: 7px; }
.nav-logo i {
  position: absolute; bottom: 7px; left: 50%; transform: translateX(-50%);
  width: 8px; height: 4px; border-top: 2px solid var(--ink);
  border-radius: 0 0 50% 50% / 0 0 100% 100%;
}
.nav-brand b { font-weight: 800; font-size: 15px; }
.nav-back { font-size: 13px; font-weight: 800; text-decoration: none; padding: 4px 2px; }
.nav-back:hover { color: var(--accent-deep); }

/* Hero */
.hero { text-align: center; padding: 40px var(--container-pad) 8px; max-width: 860px; margin: 0 auto; }
.hero-pill {
  display: inline-block;
  font-size: 13px; font-weight: 800; letter-spacing: .08em;
  background: var(--panel); color: var(--accent-deep);
  padding: 5px 16px;
  border: 2px solid var(--ink); border-radius: var(--radius-pill);
  box-shadow: 3px 3px 0 var(--ink);
  margin-bottom: 18px;
}
.hero h1 {
  font-size: clamp(30px, 3.6vw + 1rem, 50px);
  font-weight: 900; line-height: 1.2; letter-spacing: -.01em;
  text-wrap: balance;
}
.hero h1 mark { background: linear-gradient(180deg, transparent 60%, var(--highlight) 60%); color: inherit; padding: 0 4px; }
.hero p { margin: 16px auto 0; font-size: 17px; line-height: 1.9; color: var(--sub); max-width: 620px; text-wrap: pretty; }
.hero p strong { color: var(--ink); }

/* Jump buttons */
.jumps {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 12px;
  margin: 26px auto 8px; padding: 0 var(--container-pad);
}
.jump {
  display: inline-flex; align-items: center; gap: 8px;
  text-decoration: none;
  background: var(--panel);
  border: 2px solid var(--ink); border-radius: var(--radius-pill);
  box-shadow: 3px 3px 0 var(--ink);
  padding: 10px 20px;
  font-size: 16px; font-weight: 800;
  transition: transform .15s, box-shadow .15s;
}
.jump:hover { transform: translate(-1px, -2px); box-shadow: 4px 5px 0 var(--ink); }
.jump .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink); background: var(--c); }

/* Sections */
.group { max-width: var(--container-w); margin: 0 auto; padding: 40px var(--container-pad) 8px; scroll-margin-top: 16px; }
.group-head { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
.group-badge {
  width: 46px; height: 46px; flex-shrink: 0;
  display: grid; place-items: center;
  background: var(--c); border: 2px solid var(--ink); border-radius: 14px;
  box-shadow: 3px 3px 0 var(--ink);
  font-size: 22px; line-height: 1;
}
.group-head h2 { font-size: 26px; font-weight: 900; line-height: 1.25; }
.group-head p { font-size: 15px; color: var(--sub); flex-basis: 100%; margin-left: 60px; margin-top: -8px; }

.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; }

/* Panel card */
.app {
  display: flex; flex-direction: column;
  background: var(--panel);
  border: 2px solid var(--ink); border-radius: var(--radius-card);
  box-shadow: var(--shadow-base);
  text-decoration: none;
  overflow: hidden;
  transition: transform .25s var(--ease), box-shadow .25s var(--ease);
}
.app:hover, .app:focus-visible { transform: translateY(-4px) rotate(-.6deg); box-shadow: var(--shadow-hover); }
.grid .app:nth-child(even):hover, .grid .app:nth-child(even):focus-visible { transform: translateY(-4px) rotate(.6deg); }
.app:focus-visible { outline: 3px solid var(--accent-deep); outline-offset: 4px; }

.stage {
  position: relative;
  aspect-ratio: 4 / 3;
  margin: 8px 8px 0;
  border: 2px solid var(--ink);
  border-radius: 17px;
  overflow: hidden;
  background:
    radial-gradient(circle at 28% 22%, rgb(255 255 255 / .75), transparent 55%),
    var(--bg-c);
}
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage .kind {
  position: absolute; top: 10px; left: 10px; z-index: 1;
  font-size: 12px; font-weight: 800; letter-spacing: .04em;
  background: var(--panel);
  border: 2px solid var(--ink); border-radius: var(--radius-pill);
  padding: 2px 11px;
}
.stage .fallback {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-size: 56px; opacity: .9;
}
.stage.is-live .fallback { display: none; }

.body { padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.title { font-size: 21px; font-weight: 900; line-height: 1.3; }
.can { font-size: 15.5px; line-height: 1.7; color: var(--ink); text-wrap: pretty; }
.needs { display: flex; flex-wrap: wrap; gap: 6px; }
.need {
  font-size: 12.5px; font-weight: 700;
  background: var(--tag-bg);
  border: 1.5px solid var(--ink); border-radius: var(--radius-pill);
  padding: 2px 10px;
}
.open {
  margin-top: auto; align-self: flex-start;
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--ink); color: #fff;
  border-radius: var(--radius-pill);
  padding: 8px 18px 8px 20px;
  font-size: 15px; font-weight: 800;
  transition: background .15s;
}
.open svg { width: 18px; height: 18px; transition: transform .2s var(--ease); }
.app:hover .open { background: var(--accent-deep); }
.app:hover .open svg { transform: translateX(4px); }

/* 横長カード（2 列ぶん）：絵と説明を横に並べる */
.app.is-wide { grid-column: span 2; flex-direction: row; }
.app.is-wide .stage { flex: 0 0 58%; margin: 8px 0 8px 8px; }
.app.is-wide .body { padding: 22px 24px; justify-content: center; }
.app.is-wide .title { font-size: 24px; }
.app.is-wide .can { font-size: 16.5px; }
.app.is-wide .open { margin-top: 6px; }

.footer { max-width: var(--container-w); margin: 48px auto 26px; padding: 0 var(--container-pad); }
.footer-inner {
  background: var(--panel);
  border: 2px solid var(--ink); border-radius: var(--radius-card);
  box-shadow: var(--shadow-base);
  padding: 18px 24px;
  display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
  font-size: 14px; font-weight: 700;
}
.footer-inner a { text-decoration: none; }
.footer-inner a:hover { color: var(--accent-deep); }

@media (max-width: 1023px) {
  :root { --container-pad: 22px; }
  .grid { grid-template-columns: repeat(2, 1fr); gap: 20px; }
}
@media (max-width: 640px) {
  :root { --container-pad: 16px; }
  .nav { padding: 10px 16px; }
  .hero { padding-top: 28px; }
  .hero p { font-size: 16px; }
  .jump { font-size: 15px; padding: 8px 16px; }
  .grid { grid-template-columns: 1fr; gap: 20px; }
  .app.is-wide { grid-column: auto; flex-direction: column; }
  .app.is-wide .stage { flex: none; margin: 8px 8px 0; }
  .app.is-wide .body { padding: 16px 20px 20px; }
  .group-head h2 { font-size: 22px; }
  .group-head p { margin-left: 0; margin-top: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .app, .jump, .open svg { transition: none; }
  .app:hover, .grid .app:nth-child(even):hover { transform: none; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>
</head>
<body>

<nav class="nav" aria-label="サイト">
  <a class="nav-brand" href="../">
    <span class="nav-logo" aria-hidden="true"><i></i></span>
    <b>ひだまりワークス</b>
  </a>
  <a class="nav-back" href="../">トップへもどる</a>
</nav>

<header class="hero">
  <div class="hero-pill">☼ はじめての方へ</div>
  <h1>やってみたいものを、<br><mark>えらんでください</mark></h1>
  <p>動いている絵は、そのアプリで<strong>できること</strong>です。<br>気になる絵をクリック（タップ）すると、アプリがひらきます。</p>
</header>

<nav class="jumps" aria-label="種類でさがす"></nav>

<main id="groups"></main>

<footer class="footer">
  <div class="footer-inner">
    <div>© 2021–2026 hidamari works ✿</div>
    <a href="../">ひだまりワークス トップへ →</a>
  </div>
</footer>

<script type="module">
import { APPS, GROUPS } from './apps-data.js';

const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

document.querySelector('.jumps').innerHTML = GROUPS.map(g =>
  `<a class="jump" href="#${g.id}" style="--c:${g.color}"><span class="dot" aria-hidden="true"></span>${esc(g.label)}</a>`).join('');

document.getElementById('groups').innerHTML = GROUPS.map(g => `
  <section class="group" id="${g.id}" aria-labelledby="${g.id}-h">
    <div class="group-head">
      <span class="group-badge" style="--c:${g.color}" aria-hidden="true">${g.icon}</span>
      <h2 id="${g.id}-h">${esc(g.label)}</h2>
      <p>${esc(g.lead)}</p>
    </div>
    <div class="grid">
      ${APPS.filter(a => a.group === g.id).map(a => `
        <a class="app${a.wide ? ' is-wide' : ''}" href="${esc(a.href)}" data-slug="${esc(a.slug)}">
          <div class="stage" style="--bg-c:${a.bg}">
            <span class="kind">${esc(a.kind)}</span>
            <span class="fallback" aria-hidden="true">${a.emoji}</span>
            <canvas aria-hidden="true"></canvas>
          </div>
          <div class="body">
            <div class="title">${esc(a.title)}</div>
            <p class="can">${esc(a.can)}</p>
            <div class="needs" aria-label="使うもの">${a.needs.map(n => `<span class="need">${esc(n)}</span>`).join('')}</div>
            <span class="open">ひらく ${ARROW}</span>
          </div>
        </a>`).join('')}
    </div>
  </section>`).join('');

// ---- 3D パネル
const reduce = matchMedia('(prefers-reduced-motion: reduce)');
let engine;
try { engine = await import('./engine.js'); }
catch (e) { console.warn('3D を読み込めませんでした', e); }

if (engine) {
  const DPR = Math.min(devicePixelRatio || 1, 2);
  const panels = [...document.querySelectorAll('.app')].map(el => ({
    el, slug: el.dataset.slug,
    stage: el.querySelector('.stage'),
    canvas: el.querySelector('canvas'),
    inst: null, loading: false, visible: false, hover: false,
    t: 0, last: 0,
    ptr: { x: 0, y: 0 }, ptrTarget: { x: 0, y: 0 },
    poster: (APPS.find(a => a.slug === el.dataset.slug) || {}).poster ?? 2,
  }));

  const io = new IntersectionObserver(entries => {
    for (const e of entries) {
      const p = panels.find(p => p.stage === e.target);
      p.visible = e.isIntersecting;
      if (p.visible) ensure(p);
    }
  }, { rootMargin: '200px 0px' });
  panels.forEach(p => io.observe(p.stage));

  function fit(p) {
    const r = p.stage.getBoundingClientRect();
    const w = Math.max(1, Math.round(r.width * DPR)), h = Math.max(1, Math.round(r.height * DPR));
    if (p.canvas.width !== w || p.canvas.height !== h) { p.canvas.width = w; p.canvas.height = h; return true; }
    return false;
  }

  async function ensure(p) {
    if (p.inst || p.loading) return;
    p.loading = true;
    try {
      p.inst = await engine.loadScene(p.slug);
      p.t = reduce.matches ? p.poster : 0;
      fit(p);
      engine.renderTo(p.inst, p.canvas, p.t, p.ptr);
      p.stage.classList.add('is-live');
    } catch (e) { console.warn('scene', p.slug, e); }
    p.loading = false;
  }

  for (const p of panels) {
    p.el.addEventListener('pointerenter', () => { p.hover = true; });
    p.el.addEventListener('pointerleave', () => { p.hover = false; p.ptrTarget.x = 0; p.ptrTarget.y = 0; });
    p.el.addEventListener('pointermove', e => {
      const r = p.stage.getBoundingClientRect();
      p.ptrTarget.x = Math.max(-1, Math.min(1, ((e.clientX - r.left) / r.width) * 2 - 1));
      p.ptrTarget.y = Math.max(-1, Math.min(1, ((e.clientY - r.top) / r.height) * 2 - 1));
    });
  }
  addEventListener('resize', () => panels.forEach(p => { if (p.inst && fit(p)) engine.renderTo(p.inst, p.canvas, p.t, p.ptr); }));

  let prev = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, (now - prev) / 1000);
    prev = now;
    for (const p of panels) {
      if (!p.inst || !p.visible) continue;
      const animate = !reduce.matches || p.hover;
      const moved = Math.abs(p.ptr.x - p.ptrTarget.x) + Math.abs(p.ptr.y - p.ptrTarget.y) > 0.002;
      if (!animate && !moved) continue;
      p.ptr.x += (p.ptrTarget.x - p.ptr.x) * Math.min(1, dt * 6);
      p.ptr.y += (p.ptrTarget.y - p.ptr.y) * Math.min(1, dt * 6);
      if (animate) p.t += dt;
      // ホバー中は毎フレーム、それ以外は約 30fps
      if (!p.hover && now - p.last < 32) continue;
      p.last = now;
      fit(p);
      engine.renderTo(p.inst, p.canvas, p.t, p.ptr);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
